[project]
name = "prizma-research"
version = "0.1.0"
description = "Prizma research pipeline: GPT-2 export to split ONNX, SAE training, auto-interp, evaluation."
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "transformers>=4.44",
    "safetensors>=0.4",
    "huggingface-hub>=0.24",
    "numpy>=1.26",
    "onnx>=1.16",
    "onnxruntime>=1.19",
    "onnxscript>=0.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prizma_research"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
